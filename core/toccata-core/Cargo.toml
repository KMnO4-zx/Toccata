[package]
name = "toccata-core"
version = "0.0.5"
edition = "2021"

[dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
libc = "0.2"
